name: Build101 internal · force-human mixed guard patch

on:
  push:
    branches: [v2.6.101-mixed-code-database-orchestration]
    paths: [scripts/build101-force-human-approval.py]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Build101 patch
        run: python scripts/build101-force-human-approval.py
      - name: Validate syntax and guard markers
        run: |
          node --check background/local-agent-orchestrator.js
          grep -q "state?.forceHumanApproval===true?'manual'" background/local-agent-orchestrator.js
          grep -q "forceHumanApproval:payload?.forceHumanApproval===true" background/local-agent-orchestrator.js
      - name: Commit patched orchestrator
        run: |
          if git diff --quiet -- background/local-agent-orchestrator.js; then
            echo 'Expected orchestrator patch was not produced' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add background/local-agent-orchestrator.js
          git commit -m "Build 101: force human authorization inside mixed code leg"
          git push origin HEAD:v2.6.101-mixed-code-database-orchestration
